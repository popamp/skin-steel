# Popamp Steel: silver and navy, after the modern players of the 2000s.
# Generated by tools/gen_steel_skin.py; own artwork and pixel fonts.

[meta]
name = "Popamp Steel"
author = "Popamp"
format_version = 1

[sheets]
eqmain = "eq/eqmain.svg"

[text]
font = "fonts/display.ttf"
size = 7
color = "#ffffff"

[clock]
font = "fonts/clock.ttf"
size = 13
color = "#ffffff"

[playlist]
normal = "#d4dbe8"
current = "#9fb6e6"
normal_bg = "#1c3d7d"
selected_bg = "#6788c9"

[vis]
colors = ["#284a89", "#002263", "#284a89", "#ffffff", "#284a89", "#ffffff", "#284a89", "#ffffff", "#284a89", "#ffffff", "#284a89", "#ffffff", "#284a89", "#ffffff", "#284a89", "#ffffff", "#284a89", "#ffffff", "#ffffff", "#e6ecf8", "#c6d4f0", "#9fb4df", "#7d95c8", "#ffffff"]

